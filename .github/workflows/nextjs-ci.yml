# Build-only check for the Next.js rebuild in web/. This workflow never deploys:
# the live GitHub Pages site stays controlled by jekyll.yml until the cutover.
name: Build Next.js site (no deploy)

on:
  push:
    branches: [nextjs]
    paths:
      - 'web/**'
      - '.github/workflows/nextjs-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/nextjs-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Upload exported site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-out
          path: web/out
          retention-days: 7
